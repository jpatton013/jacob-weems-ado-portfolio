<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jacob Weems-Ado</title>
<meta name="description" content="Jacob Weems-Ado.">
<link rel="stylesheet" href="after-hours.css">
</head>
<body>

<!-- Arrives already dark and letterboxed — explosion.html's lightswitch
     closes the lights/bars down before handing off here, so the page
     swap underneath that transition is invisible; this is meant to
     read as the same room with the lights off, not a new page.
     Goes straight back to the landing page, same as every other
     back-link on the site. -->
<a class="back-link" href="index.html">&larr; back</a>

<!-- Static the whole way through — not just at the end of the scroll —
     so there's always a quiet way out back to the mess page without
     scrolling all the way down. Same spot as explosion.html's own
     lightswitch, right next to the back link; lights-on.js handles the
     soft fade-back-up before it navigates. -->
<button type="button" class="ah-lights-on-btn" id="ah-lights-on" aria-label="lights"></button>
<div class="ah-lights-on-scrim" id="ah-lights-on-scrim" aria-hidden="true"></div>

<div class="ah-bar ah-bar-top"></div>
<div class="ah-bar ah-bar-bottom"></div>
<div class="ah-spotlight" aria-hidden="true"></div>

<!-- Scroll drives which of the 102 frames is showing (see after-hours.js).
     Once you scroll far enough to reach the last frame, an old-movie
     countdown runs on its own, then the finished film takes over and
     plays for real. -->
<section class="ah-spacer" id="ah-spacer">
  <div class="ah-viewport" id="ah-viewport">
    <img class="ah-frame" id="ah-frame" src="images/reel/frame-001.jpg" alt="">

    <div class="ah-countdown" id="ah-countdown" aria-hidden="true">
      <div class="ah-countdown-ring">
        <span class="ah-countdown-num" id="ah-countdown-num">5</span>
      </div>
    </div>

    <video class="ah-video" id="ah-video" src="videos/reel.mp4" playsinline muted preload="none"></video>
    <button type="button" class="ah-sound-btn" id="ah-sound-btn" hidden>tap for sound</button>

    <!-- Not claiming the shot, just pointing at what it's in conversation
         with — Paul Schrader's First Reformed ends on a similar beat. -->
    <p class="ah-credit" id="ah-credit">
      inspired by the final scene of
      <a href="https://www.youtube.com/watch?v=jr3MjqEibjc" target="_blank" rel="noopener">First Reformed</a>
    </p>
  </div>
</section>

<!-- Keep scrolling past the video and, at the true bottom of the page
     (no extra scroll distance added for this), the screen flickers like
     a reel change and reloads at the top of after-hours-2.html — same
     idea as earlier-work.html handing off to seascapes.html, just
     re-themed for a projector flicker instead of a tide wash. -->
<footer class="ah-end" id="ah-end">
  <p class="ah-end-hint" id="ah-end-hint">keep scrolling&hellip;</p>
</footer>

<div class="ah-reload" id="ah-reload" aria-hidden="true">
  <div class="ah-reload-flicker"></div>
</div>

<script src="after-hours.js"></script>
<script src="lights-on.js"></script>
</body>
</html>
