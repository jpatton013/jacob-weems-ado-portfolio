<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jacob Weems-Ado</title>
<meta name="description" content="Jacob Weems-Ado.">
<link rel="stylesheet" href="after-hours.css">
</head>
<body>

<!-- Reached via after-hours.html's reel-change flicker once you scroll
     past the first piece's video. Arrives already dark/letterboxed —
     same "invisible page swap" trick as the rest of the site's
     transitions — and runs the same scroll-scrub setup as the first
     reel, just pointed at a second, shorter set of frames. No finished
     film for this one yet (see after-hours-2.js): it holds on the last
     frame until a video file shows up at videos/reel-2.mp4. -->
<a class="back-link" href="index.html">&larr; back</a>

<button type="button" class="ah-lights-on-btn" id="ah-lights-on" aria-label="lights"></button>
<span class="ah-lights-on-label" aria-hidden="true">turn the lights back on</span>
<div class="ah-lights-on-scrim" id="ah-lights-on-scrim" aria-hidden="true"></div>

<div class="ah-bar ah-bar-top"></div>
<div class="ah-bar ah-bar-bottom"></div>
<div class="ah-spotlight" aria-hidden="true"></div>

<!-- No countdown here — that's piece-1-only, since it's the only reel
     with a finished film to count down into so far. This one just holds
     on the last frame and shows the "more soon" caption. -->
<section class="ah-spacer" id="ah-spacer">
  <div class="ah-viewport" id="ah-viewport">
    <img class="ah-frame" id="ah-frame" src="images/reel-2/frame-001.jpg" alt="">

    <video class="ah-video" id="ah-video" src="videos/reel-2.mp4" playsinline muted preload="none"></video>
    <button type="button" class="ah-sound-btn" id="ah-sound-btn" hidden>tap for sound</button>
  </div>
</section>

<!-- Same reel-change hand-off as after-hours.html, chained one piece
     further: scroll to the true bottom and it flickers into
     after-hours-3.html, reset to the top for the third piece. -->
<footer class="ah-end" id="ah-end">
  <p class="ah-end-hint" id="ah-end-hint">keep scrolling&hellip;</p>
</footer>

<div class="ah-reload" id="ah-reload" aria-hidden="true">
  <div class="ah-reload-flicker"></div>
</div>

<script src="after-hours-2.js"></script>
<script src="lights-on.js"></script>
</body>
</html>
